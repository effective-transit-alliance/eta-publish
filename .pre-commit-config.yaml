# `pre-commit install` installs both,
# so a clone that follows the README gets the push check
# as well as the commit checks.
default_install_hook_types: [pre-commit, pre-push]
# A hook that names no stage runs at both of those,
# and the ones with nothing to skip on (`pytest`, `ty`) ran twice a commit.
# The commit checks are commit checks; the other stage names its own hooks.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Every Python tool runs from the project's own environment,
      # at the version `uv.lock` pins, rather than from a copy pinned here:
      # two pins for one tool drift apart, and a hook and CI then disagree.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]

      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

      # From `node_modules/`, as `bun.lock` pins it and what it depends on,
      # and on `bun` rather than on whichever `node` is on `$PATH`.
      # The rules it skips, and why, are in `.markdownlint-cli2.jsonc`.
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise x -- bun run --bun markdownlint-cli2
        language: system
        types: [markdown]

      # The stylesheets, scripts, and configuration written here.
      # A build lays out what it writes on its own (`format.py`),
      # but nothing laid out what it copies from.
      # Not `site/`, which is a build's, nor the test fixtures,
      # which are the documents and API responses as they were downloaded.
      # Through `mise`, at the version `mise.toml` pins, like the build's.
      - id: biome-format
        name: biome format
        entry: mise x -- biome format
        language: system
        # By name: `pre-commit` gives a `.jsonc` file no type.
        files: \.(css|m?js|jsonc?)$
        exclude: ^(site|tests/fixture)/

      # Like the others, from the project's own environment,
      # so it sees exactly the dependencies `uv` installs.
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false

      # Skipped for a commit that changes only files no test reads:
      # `scripts/pytest-unless-unread.sh` says which, and why not an `exclude:`.
      - id: pytest
        name: pytest
        entry: scripts/pytest-unless-unread.sh
        language: script
        pass_filenames: false
        always_run: true

      # The drafts in `drafts/`, built with the code being committed,
      # so a change that breaks one is refused, as one that breaks a publication here is.
      # Into a directory of its own, leaving `drafts/` as it is;
      # nothing at all with no `drafts/`, as in CI. See `docs/drafts.md`.
      - id: drafts-build
        name: the drafts build with the code being committed
        entry: scripts/drafts-commit.sh check
        language: script
        pass_filenames: false
        always_run: true

      # On push rather than on commit:
      # it fetches every document, which is slow and needs credentials.
      # On every branch, though only `main` deploys:
      # a branch whose site is already stale is a merge that will fail,
      # and the point is not to find that out at the merge.
      - id: committed-site
        name: the committed site is what a fresh build writes
        entry: scripts/check-committed-site.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
