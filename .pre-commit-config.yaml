# `pre-commit install` installs all three,
# so a clone that follows the README gets the message and push checks
# as well as the commit checks.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.69
    hooks:
      - id: ty

  - repo: local
    hooks:
      # From `mise.toml`, where its version is pinned.
      # The rules it skips, and why, are in `.markdownlint-cli2.jsonc`.
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise x -- markdownlint-cli2
        language: system
        types: [markdown]

      # From the project's own environment rather than pre-commit's,
      # so it sees exactly the dependencies `uv` installs
      # instead of a list here that has to be kept in step with `pyproject.toml`.
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true

      # `Co-Authored-By:` is easy to write and still looks right,
      # so the spelling `CLAUDE.md` asks for is checked here
      # rather than caught in review, or not caught.
      - id: commit-message
        name: the commit message attributes Claude the way `CLAUDE.md` says
        entry: scripts/check-commit-message.sh
        language: script
        stages: [commit-msg]

      # On push rather than on commit:
      # it fetches every document, which is slow and needs credentials.
      # On every branch, though only `main` deploys:
      # a branch whose site is already stale is a merge that will fail,
      # and the point is not to find that out at the merge.
      - id: committed-site
        name: the committed site is what a fresh build writes
        entry: scripts/check-committed-site.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
