name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # `biome` formats the emitted HTML, so a build without it writes
      # nothing, and the tests compare against pages it laid out.
      - uses: jdx/mise-action@v5

      # The npm packages, at what `bun.lock` pins, failing rather than resolving afresh
      # if `package.json` asks for something the lockfile does not have.
      # Not cached: from an empty cache they install in about a second,
      # and the cache they install from is 46 MB to save and restore.
      - name: bun install
        run: bun install --frozen-lockfile

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: ty
        run: uv run ty check

      - name: pyrefly
        run: uv run pyrefly check

      # Through its pre-commit hook, which lints the tracked files and no others:
      # a glob would also find the Markdown inside `.venv/`.
      - name: markdownlint
        run: pre-commit run markdownlint-cli2 --all-files

      # Through its pre-commit hook too, for which files it formats.
      - name: biome format
        run: pre-commit run biome-format --all-files

      # The `network` marker is deselected by default (see `pyproject.toml`),
      # so CI never needs Google credentials.
      - name: pytest
        run: uv run pytest
