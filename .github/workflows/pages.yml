# Publish the site to GitHub Pages, built from the live Google Doc.
#
# On every push to `main`, so what is published is what the repository says.
# Publishing was manual, on the reasoning that a report goes out
# when someone decides it is ready; merging to `main` is that decision,
# and a deploy remembered separately is one that gets forgotten.
#
# Note what this means: the deploy fetches the documents rather than serving
# the committed `site/`, so a push republishes whatever the Google Doc says
# at that moment. It has to be:
# the images are not in the repository (18 MB, and every fetch rewrites them),
# so a checkout alone is not a site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only on the repository.
# `pages` and `id-token` are what the deploy needs,
# and nothing here writes a commit.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a running one finish:
# cancelling mid-deploy can leave the site serving a half-uploaded build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `biome` lays out the emitted HTML, so a build without it writes nothing.
      - uses: jdx/mise-action@v3

      # Which sources the Wayback Machine has no capture of.
      #
      # A runner starts with nothing, so without this every run re-asks the
      # index about all of them, which is the slowest thing the build does and
      # takes minutes. Nothing is written to `site/` either way, so a restored
      # cache, a stale one and a missing one all build the same bytes and
      # `check-committed-site.sh` compares the same.
      #
      # `~/.cache/eta-publish` is where `platformdirs` puts it on Linux.
      #
      # The key carries the run id so each run saves its own, and `restore-keys`
      # is what makes the previous one the starting point: a key that never
      # changes would restore the first run's cache forever and never save
      # another, and the week would never expire.
      - name: Restore the archive lookups
        uses: actions/cache@v6
        with:
          path: ~/.cache/eta-publish
          key: archive-lookups-${{ github.run_id }}
          restore-keys: archive-lookups-

      # Written to the runner's temp directory rather than the workspace,
      # so it cannot be picked up by a later step that globs the checkout.
      - name: Write the service account key
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "::error::the GOOGLE_CREDENTIALS secret is not set; see README" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/key.json"

      # Pinned rather than latest:
      # the PDF is a deliverable,
      # and a Typst release that changed layout would silently reflow it.
      - name: Install Typst
        run: |
          version=0.15.1
          url="https://github.com/typst/typst/releases/download/v${version}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL "$url" | tar -xJ --strip-components=1 -C "$RUNNER_TEMP" \
            "typst-x86_64-unknown-linux-musl/typst"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # A chart credited to ETA is drawn to see whether its top right corner is empty
      # for the logo, with DejaVu standing in for the fonts it names.
      # Without DejaVu its text draws as nothing, so the build puts every logo
      # above its chart, and the committed charts no longer match.
      - name: Install the fonts charts are drawn in
        run: |
          if ! fc-list | grep -q "DejaVu Sans"; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi

      # Which documents to build lives in `reports.toml`,
      # so adding the next report is a pull request rather than an edit to this file.
      #
      # Building and checking are one script, which is also what the pre-push hook runs,
      # so what may be published is decided in one place
      # rather than by a workflow step and a hook that have to be kept in step.
      # Failing here publishes nothing and keeps the previous deploy up,
      # which is the safe direction.
      - name: Build the reports, and check they are what was committed
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/key.json
        run: scripts/check-committed-site.sh

      # The deploy is a copy of `site/unpublished/`, minus one file,
      # plus `site/published/` inside it.
      #
      # `doc.json` is the API response as fetched,
      # so it carries the email address behind every person chip,
      # and `Public Contributors:` is made of person chips.
      # The report publishes the names;
      # publishing the response would publish the addresses at a stable URL.
      # It is also 441 KB of raw JSON and signed image URLs that nothing reads.
      #
      # `template.typ` stays: `report.typ` imports it,
      # and serving the Typst source without it would be serving source that cannot compile.
      - name: Drop the API response
        run: find site -name doc.json -delete

      # Until `site/published/` has a host of its own,
      # it is served from this one under `/published/`, which is where `reports.toml` says it is.
      # Copied rather than moved, since the build compares `site/` with what is committed.
      - name: Serve the published reports under /published/
        run: cp -a site/published site/unpublished/published

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/unpublished

      - id: deploy
        uses: actions/deploy-pages@v5
