# Publish the site to GitHub Pages, built from the live Google Doc.
#
# On every push to `main`, so what is published is what the repository says.
# Publishing was manual, on the reasoning that a publication goes out
# when someone decides it is ready; merging to `main` is that decision,
# and a deploy remembered separately is one that gets forgotten.
#
# Note what this means: the deploy fetches the documents rather than serving
# the committed `site/`, so a push republishes whatever the Google Doc says
# at that moment. It has to be:
# the images are not in the repository (18 MB, and every fetch rewrites them),
# so a checkout alone is not a site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only on the repository, and nothing here writes a commit.
# `deploy` alone gets what publishing needs.
permissions:
  contents: read

jobs:
  # A newer push makes this build moot, so it is cancelled rather than finished:
  # it is the slow part, and nothing it does is seen until `deploy` runs.
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: true
    # The `eta-publish` provider signs in only runs in this environment,
    # and the environment admits only `main`,
    # so no other branch or workflow can act as the service account.
    environment:
      name: github-pages
    # `id-token` is for the sign-in to Google, which exchanges the run's OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The tools, the cache, and the sign-in,
      # set up as `eta-drafts`'s deploy sets them up.
      # The cache is saved when the job ends, so only from a build that was checked.
      - uses: ./.github/actions/build-setup
        with:
          workload-identity-provider: projects/635412927675/locations/global/workloadIdentityPools/github-actions/providers/eta-publish

      # Which documents to build lives in `publications.toml`,
      # so adding the next publication is a pull request rather than an edit to this file.
      #
      # Building and checking are one script, which is also what the pre-push hook runs,
      # so what may be published is decided in one place
      # rather than by a workflow step and a hook that have to be kept in step.
      # Failing here publishes nothing and keeps the previous deploy up,
      # which is the safe direction.
      - name: Build the publications, and check they are what was committed
        run: scripts/check-committed-site.sh

      # The deploy is a copy of `site/unpublished/`, minus one file,
      # plus `site/published/` inside it.
      #
      # `doc.json` is the API response as fetched,
      # so it carries the email address behind every person chip,
      # and `Public Contributors:` is made of person chips.
      # The publication shows the names;
      # publishing the response would publish the addresses at a stable URL.
      # It is also 441 KB of raw JSON and signed image URLs that nothing reads.
      #
      # `template.typ` stays: `report.typ` or `statement.typ` imports it,
      # and serving the Typst source without it would be serving source that cannot compile.
      - name: Drop the API response
        run: find site -name doc.json -delete

      # Until `site/published/` has a host of its own,
      # it is served from this one under `/published/`, which is where `publications.toml` says it is.
      # Copied rather than moved, since the build compares `site/` with what is committed.
      - name: Serve the live publications under /published/
        run: cp -a site/published site/unpublished/published

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/unpublished

  # One deploy at a time, and let a running one finish:
  # cancelling mid-deploy can leave the site serving a half-uploaded build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    # `pages` and `id-token` are what the deploy needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
