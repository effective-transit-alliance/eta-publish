[project]
name = "eta-publish"
version = "0.1.0"
description = "Convert ETA Google Doc reports into publish-ready HTML."
requires-python = ">=3.15"
dependencies = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "htpy>=26.5.1",
    "pillow>=11.0",
    "platformdirs>=4.11.8",
    "pymdown-extensions>=11",
    "pypdf>=6.19.0",
    "requests>=2.32",
    "rich>=14",
    "typer>=0.27.1",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
eta-publish = "eta_publish.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyrefly>=1.2.0",
    "ruff>=0.17.1",
    "ty>=0.0.70",
    "types-requests>=2.32",
    "svgelements>=1.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eta_publish"]
artifacts = ["eta_publish/assets/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# `RUF100` so a `noqa` for a rule not selected here is reported rather than
# read as a suppression that is doing something. Every one in the tree was
# inert: `S` and `BLE` are not on this list and never were.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.pyrefly]
preset = "strict"
# Test modules import each other by name, the way `pytest` resolves them.
search-path = ["tests"]
# `pymdown-extensions` ships no `py.typed`, so a strict check refuses to read it at all.
# The one thing imported from it is a slug function taking and returning `str`,
# and `naming.slugify` states that signature.
# `svgelements` declares itself ISO-8859-1 in its first line,
# and both checkers read a file they cannot decode as UTF-8 as empty,
# so every name in it is missing rather than untyped.
# Only `scripts/flatten-svg.py` imports it.
replace-imports-with-any = ["pymdownx.slugs", "svgelements", "svgelements.**"]

[tool.ty.rules]
blanket-ignore-comment = "warn"
division-by-zero = "warn"
missing-override-decorator = "warn"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
unsupported-dynamic-base = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Anything reaching the Docs API is opt-in: `uv run pytest -m network`.
# Everything else runs against the checked-in fixture,
# so neither CI nor a pre-commit hook ever needs Google credentials.
markers = ["network: needs internet access and Google credentials"]
addopts = "-m 'not network'"

[tool.ty.analysis]
# `svgelements` reads as empty; see `[tool.pyrefly]`.
replace-imports-with-any = ["svgelements", "svgelements.**"]
